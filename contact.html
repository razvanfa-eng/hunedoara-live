<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Hunedoara Live</title>
  <meta name="description" content="Scrie-ne, propune un loc sau raportează o informație greșită pe Hunedoara Live.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" data-i18n="site.name">Hunedoara Live</a>
      <nav class="site-nav">
        <a href="locuri.html" data-i18n="nav.locuri">Locuri</a>
        <a href="activitati.html" data-i18n="nav.activitati">Activități</a>
        <a href="istorie.html" data-i18n="nav.istorie">Istorie</a>
        <a href="orase.html" data-i18n="nav.orase">Orașe</a>
        <a href="stiri.html" data-i18n="nav.stiri">Știri</a>
        <a href="afaceri.html" data-i18n="nav.afaceri">Afaceri</a>
        <a href="utile.html" data-i18n="nav.utile">Utile</a>
        <a href="contact.html" aria-current="page" data-i18n="nav.contact">Contact</a>
        <button id="lang-toggle" class="lang-toggle" type="button" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switch.aria">EN</button>
      </nav>
    </div>
  </header>

  <main class="container prose">
    <h1 data-i18n="contact.heading">Contact</h1>
    <p data-i18n="contact.intro">Ai o întrebare, o sugestie sau vrei să propui un loc? Scrie-ne.</p>

    <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Nu completa acest câmp: <input name="bot-field"></label></p>
      <label>
        <span data-i18n="contact.form.name">Numele tău</span>
        <input type="text" name="name" required maxlength="80">
      </label>
      <label>
        <span data-i18n="contact.form.email">Adresa ta de e-mail</span>
        <input type="email" name="email" required>
      </label>
      <label>
        <span data-i18n="contact.form.subject">Subiect</span>
        <input type="text" name="subject" maxlength="140">
      </label>
      <label>
        <span data-i18n="contact.form.message">Mesajul tău</span>
        <textarea name="message" rows="5" required maxlength="4000"></textarea>
      </label>
      <button class="btn btn--primary" type="submit" data-i18n="contact.form.submit">Trimite mesajul</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div>
        <a class="brand" href="index.html" data-i18n="site.name">Hunedoara Live</a>
        <div class="footer-tagline" data-i18n="footer.tagline">ghidul digital al județului Hunedoara</div>
      </div>
    </div>
    <div class="container"><p class="footer-note" data-i18n="footer.note">Proiect independent, necomercial.</p></div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
