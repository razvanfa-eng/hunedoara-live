# Configurare Netlify.
# Site static în rădăcină + funcții în netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# =====================================================================
# SECURITATE — antete HTTP
# =====================================================================
# Content-Security-Policy — sursele permise (inventariate din HTML/JS/CSS):
#  - script: doar fișierele proprii (/js/...). Configurația paginilor e în blocuri
#    <script type="application/json"> și JSON-LD (application/ld+json) — date, nu cod,
#    deci nu cer 'unsafe-inline'. Singurele handlere inline permise, prin hash
#    ('unsafe-hashes'): onerror="RL.imgError(this)" (imagini), onsubmit="return false;"
#    (newsletter, index) și onclick="location.reload()" (offline.html).
#    DACĂ SCHIMBI textul unuia dintre ele, recalculează hash-ul:
#      printf '%s' 'RL.imgError(this)' | openssl dgst -sha256 -binary | base64
#    challenges.cloudflare.com = captcha Turnstile (doar cu recenziile „remote”).
#  - style: css/style.css (fonturile sunt găzduite local în /fonts); 'unsafe-inline' doar pentru stiluri
#    (atributele style="..." din pagini și fundalurile tile-urilor din home.js).
#  - font: doar 'self' (/fonts/*.woff2, SIL OFL). img: proprii + data:/blob: (poza recenziei în modul
#    local, previzualizarea din formularul „Trimite o poză”) + Supabase Storage (pozele
#    recenziilor în modul „remote”) + tile.openstreetmap.org (DOAR dreptunghiurile hărții
#    din harta.html; Leaflet e self-hosted în /vendor/leaflet, deci niciun script extern).
#  - connect: proprii (service worker, funcția de recenzii) + Supabase (citirea recenziilor)
#    + api.open-meteo.com (DOAR vreme.html: prognoză fără cheie și fără cookie-uri, cerere GET
#    cu credentials omit și referrer-policy no-referrer; nimic altceva nu e permis).
#  - form-action 'self': formularul de contact (Netlify Forms -> /multumim.html).
#  - frame-ancestors 'none': site-ul nu poate fi încadrat în alt site (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-2ne4wUUWpzMxLwoazH2X92gegM2NRhGZ5oB3r3XyFgE=' 'sha256-2rvfFrggTCtyF5WOiTri1gDS8Boibj4Njn0e+VCBmDI=' 'sha256-9gOBGqEQINNDuds+tkXbNzih6klbz+KeCyxEj4KRLeM=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co https://api.open-meteo.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Service worker-ul: mereu verificat la server (altfel actualizările site-ului întârzie).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# =====================================================================
# PERFORMANȚĂ — antete de cache pentru fișierele statice
# =====================================================================
# HTML și sw.js rămân cu valoarea implicită Netlify (public, max-age=0, must-revalidate): conținutul nou
# apare imediat. Fonturile au nume stabile și nu se schimbă -> 1 an, immutable. Pozele (images/), iconițele
# și bibliotecile (vendor/) -> 7 zile + stale-while-revalidate. CSS/JS nu au hash în nume (service worker-ul
# le reîmprospătează oricum în fundal) -> 10 minute + stale-while-revalidate. Dacă înlocuiești o poză
# păstrând numele, vizitatorii o văd cel târziu după 7 zile; pentru actualizare imediată dă-i alt nume.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# =====================================================================
# SECURITATE — fișiere care NU sunt parte din site
# =====================================================================
# Site-ul se publică din rădăcina repo-ului (publish = "."), deci fără regulile de
# mai jos ar fi servite și sursele/uneltele proiectului. Le răspundem cu 404
# (force = true: chiar dacă fișierul există). Primele în listă = prioritare.
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

# URL-uri vechi ale paginilor de detaliu (pagina.html?id=X) -> pagina statică
# /<secțiune>/X/ generată de scripts/build-pages.mjs. 301 permanent.
# force = true: șablonul (ex. oras.html) există ca fișier, altfel Netlify l-ar servi
# pe el și ar ignora regula („shadowing”).
# Netlify potrivește regula doar dacă URL-ul are EXACT parametrii din `query` —
# de aceea o regulă și pentru linkurile deschise din Facebook (?id=X&fbclid=...).
# Orice altă combinație de parametri cade pe șablon, care randează intrarea tot
# din ?id= (js/detail.js), deci linkul merge oricum.

[[redirects]]
  from = "/destinatie.html"
  to = "/destinatii/:id/"
  status = 301
  force = true
  query = { id = ":id", fbclid = ":fbclid" }

[[redirects]]
  from = "/destinatie.html"
  to = "/destinatii/:id/"
  status = 301
  force = true
  query = { id = ":id" }

[[redirects]]
  from = "/oras.html"
  to = "/orase/:id/"
  status = 301
  force = true
  query = { id = ":id", fbclid = ":fbclid" }

