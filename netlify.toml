# Configurare Netlify.
# Site static în rădăcină + funcții în netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# URL-uri vechi ale paginilor de detaliu (pagina.html?id=X) -> pagina statică
# /<secțiune>/X/ generată de scripts/build-pages.mjs. 301 permanent.
# force = true: șablonul (ex. oras.html) există ca fișier, altfel Netlify l-ar servi
# pe el și ar ignora regula („shadowing”).
# Netlify potrivește regula doar dacă URL-ul are EXACT parametrii din `query` —
# de aceea o regulă și pentru linkurile deschise din Facebook (?id=X&fbclid=...).
# Orice altă combinație de parametri cade pe șablon, care randează intrarea tot
# din ?id= (js/detail.js), deci linkul merge oricum.

[[redirects]]
  from = "/destinatie.html"
  to = "/destinatii/:id/"
  status = 301
  force = true
  query = { id = ":id", fbclid = ":fbclid" }

[[redirects]]
  from = "/destinatie.html"
  to = "/destinatii/:id/"
  status = 301
  force = true
  query = { id = ":id" }

