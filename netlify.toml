# Știri scoase din js/data.js (evenimente trecute): build-pages.mjs le șterge
# pagina statică, iar linkurile vechi (ex. din postări Facebook) duc la listarea
# știrilor în loc de 404. Fără force: paginile /stiri/<id>/ care există încă au
# prioritate („shadowing”), deci regula se aplică doar celor dispărute.
[[redirects]]
  from = "/stiri/*"
  to = "/stiri.html"
  status = 301

# La fel pentru versiunea în engleză (/en/stiri/<id>/ -> listarea EN a știrilor).
# Paginile EN nu au avut niciodată URL-uri vechi cu ?id=, deci nu au alte redirect-uri.
[[redirects]]
  from = "/en/stiri/*"
  to = "/en/stiri.html"
  status = 301

# Pagina 404 personalizată
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
